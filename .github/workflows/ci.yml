name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Windows is new: tests that need POSIX shell fake tools are still being ported.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # The external tools the formats run; tests of a format skip when its tool is absent.
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # one by one: a package missing from this Ubuntu only skips that format's tests
          for p in jpegoptim libjpeg-turbo-progs webp gifsicle imagemagick libtiff-tools flac sqlite3 qpdf mupdf-tools \
                   advancecomp zopfli p7zip-full binutils upx-ucl gpac libdeflate-tools cabextract xz-utils mkclean mp4v2-utils; do
            sudo apt-get install -y --no-install-recommends "$p" || echo "::warning::$p not available"
          done
          # ffmpeg: Ubuntu's 6.1 remuxes Matroska with shifted start times, so use a current static build
          curl -fsSL --retry 4 --retry-all-errors https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | sudo tar xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' || { echo "::warning::static ffmpeg not installed"; sudo apt-get install -y ffmpeg; }
          # oxipng: static release binary
          curl -fsSL --retry 4 --retry-all-errors https://github.com/shssoichiro/oxipng/releases/download/v10.2.1/oxipng-10.2.1-x86_64-unknown-linux-musl.tar.gz | tar xz --strip-components=1 -C /tmp && sudo mv /tmp/oxipng /usr/local/bin/ || echo "::warning::oxipng not installed"
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install oxipng jpegoptim mozjpeg webp gifsicle imagemagick libtiff ffmpeg flac qpdf mupdf-tools \
            advancecomp zopfli sevenzip binutils upx gpac mkclean mp4v2 libdeflate cabextract
          brew install tdewolff/tap/minify resvg || true
      - name: Tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # best effort: a package or download that is missing only skips that format's tests
          foreach ($p in 'ffmpeg','imagemagick','7zip','qpdf','gifsicle','libjpeg-turbo','webp','flac','mupdf','sqlite','upx','mingw','minify','gpac') {
            choco install -y --no-progress $p
            if ($LASTEXITCODE -ne 0) { Write-Warning "$p not installed" }
          }
          # release binaries, into a folder that is already on PATH
          $bin = 'C:\ProgramData\chocolatey\bin'
          function Get-Zip($url, $name, $match = '.') {
            curl.exe -fsSL --retry 4 --retry-all-errors -o "$name.zip" $url
            if ($LASTEXITCODE -ne 0) { Write-Warning "$name not downloaded"; return }
            Expand-Archive "$name.zip" -DestinationPath "$name-x" -Force
            Get-ChildItem "$name-x" -Recurse -Include '*.exe','*.dll' | Where-Object { $_.FullName -match $match } | ForEach-Object { Copy-Item $_.FullName $bin -Force }
          }
          Get-Zip 'https://github.com/shssoichiro/oxipng/releases/download/v10.2.1/oxipng-10.2.1-x86_64-pc-windows-msvc.zip' oxipng
          Get-Zip 'https://github.com/tdewolff/minify/releases/latest/download/minify_windows_amd64.zip' minify
          Get-Zip 'https://github.com/linebender/resvg/releases/latest/download/resvg-win-x86_64.zip' resvg
          Get-Zip 'https://github.com/amadvance/advancecomp/releases/latest/download/advancecomp-2.6-windows-x64.zip' advancecomp
          Get-Zip 'https://github.com/tukaani-project/xz/releases/latest/download/xz-5.8.4-windows.zip' xz 'x86-64'
          Get-Zip 'https://github.com/tjko/jpegoptim/releases/latest/download/jpegoptim-1.5.6-x64-windows.zip' jpegoptim
          # libjpeg-turbo (jpegtran, cjpeg) installs outside PATH
          Add-Content $env:GITHUB_PATH 'C:\libjpeg-turbo64\bin'
          $global:LASTEXITCODE = 0

      - run: bun run fixtures:fetch
        continue-on-error: true # a mirror can be down; the corpus test skips what is missing
      - name: debug exe alone
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          which -a strip
          time timeout 120 bun test packages/engine/test/exe.test.ts 2>&1 | tail -40
      - run: bun run typecheck
      - run: bun scripts/no-any.ts
      - run: bun test
