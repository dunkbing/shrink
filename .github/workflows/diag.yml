name: diag
on: workflow_dispatch
jobs:
  win:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: choco install nsis -y --no-progress
      - name: Package
        shell: bash
        working-directory: apps/desktop
        run: bun run package
      - name: Build without hideConsole
        shell: bash
        working-directory: apps/desktop
        run: |
          cat > /tmp/nohide.ts <<'TS'
          import { build } from "./node_modules/mantou-ui/runtime/build.ts";
          console.log(await build("src/main.tsx", "C:/nohide", "ShrinkDbg.exe"));
          TS
          cp /tmp/nohide.ts ./nohide.ts
          bun nohide.ts
      - name: Run installed (hidden console)
        if: always()
        shell: pwsh
        run: |
          $i = Get-ChildItem apps/desktop/dist/*.exe | Select -First 1
          Start-Process $i.FullName -ArgumentList '/S','/D=C:\shrink-app' -Wait
          Get-ChildItem C:\shrink-app
          $p = Start-Process C:\shrink-app\Shrink.exe -PassThru -RedirectStandardOutput C:\out-hidden.txt -RedirectStandardError C:\err-hidden.txt
          Start-Sleep 15
          "alive: $(-not $p.HasExited) exit: $($p.ExitCode)"
          Get-Content C:\out-hidden.txt, C:\err-hidden.txt
          Get-Process | Where-Object { $_.ProcessName -match 'Shrink|bun|conhost' } | Format-Table Id,ProcessName,MainWindowTitle
      - name: Launch like Explorer
        if: always()
        shell: pwsh
        run: |
          Get-Process Shrink -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force $env:APPDATA\Shrink, $env:LOCALAPPDATA\Shrink -ErrorAction SilentlyContinue
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Shrink.lnk"
          "lnk exists: $(Test-Path $lnk)"
          Start-Process $lnk
          Start-Sleep 15
          "after lnk: " + ((Get-Process Shrink -ErrorAction SilentlyContinue | Measure-Object).Count)
          Get-Process Shrink -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          Start-Process explorer.exe C:\shrink-app\Shrink.exe
          Start-Sleep 15
          "after explorer: " + ((Get-Process Shrink -ErrorAction SilentlyContinue | Measure-Object).Count)
          Get-Process Shrink -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          $psi = [System.Diagnostics.ProcessStartInfo]::new('C:\shrink-app\Shrink.exe'); $psi.UseShellExecute = $true
          $p = [System.Diagnostics.Process]::Start($psi); Start-Sleep 15
          "after shellexecute: alive=$(-not $p.HasExited) exit=$($p.ExitCode)"
          # second launch
          $q = [System.Diagnostics.Process]::Start($psi); Start-Sleep 5
          "second: exited=$($q.HasExited) first alive=$(-not $p.HasExited)"
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2,3} -MaxEvents 15 -ErrorAction SilentlyContinue | Format-List TimeCreated,ProviderName,Message
          Get-ChildItem -Recurse $env:APPDATA\Shrink, $env:LOCALAPPDATA\Shrink -ErrorAction SilentlyContinue | Select FullName
      - name: Run from source
        if: always()
        shell: bash
        working-directory: apps/desktop
        run: |
          timeout 25 bun run start > /c-src.txt 2>&1; echo "exit $?"; cat /c-src.txt | head -80
