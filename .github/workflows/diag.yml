name: diag
on: workflow_dispatch
jobs:
  win:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: choco install nsis -y --no-progress
      - name: Package
        shell: bash
        working-directory: apps/desktop
        run: bun run package
      - name: Console on failure
        shell: pwsh
        run: |
          Start-Process (Get-ChildItem apps/desktop/dist/*.exe).FullName -ArgumentList '/S','/D=C:\shrink-app' -Wait
          Copy-Item C:\shrink-app C:\broken -Recurse
          [IO.File]::WriteAllBytes('C:\broken\mantou_ffi.dll', (New-Object byte[] 4096))
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices; using System.Collections.Generic;
          public class W { public delegate bool CB(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(CB cb, IntPtr l);
            [DllImport("user32.dll")] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            public static List<string> Classes() { var r = new List<string>(); EnumWindows((h,l)=>{ var s = new StringBuilder(256); GetClassName(h,s,256); if (s.ToString()=="ConsoleWindowClass" || s.ToString().Contains("Console") || s.ToString()=="CASCADIA_HOSTING_WINDOW_CLASS") r.Add(s + (IsWindowVisible(h)?":visible":":hidden")); return true; }, IntPtr.Zero); return r; } }
          "@
          function Probe($label, $cmdline) {
            "=== $label"
            $known = @{}; Get-Process | % { $known[$_.Id] = 1 }
            $p = [Diagnostics.Process]::Start([Diagnostics.ProcessStartInfo]::new($cmdline))
            $log = @{}
            1..200 | % { Start-Sleep -Milliseconds 25
              Get-CimInstance Win32_Process | ? { -not $known.ContainsKey([int]$_.ProcessId) -and -not $log.ContainsKey([int]$_.ProcessId) } | % { $log[[int]$_.ProcessId] = "$($_.Name) pid=$($_.ProcessId) ppid=$($_.ParentProcessId) cmd=$($_.CommandLine)" }
            }
            $log.Values
            "exited=$($p.HasExited)"
            Get-Process Shrink -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          Probe 'healthy' 'C:\shrink-app\Shrink.exe'
