name: diag
on: workflow_dispatch
jobs:
  win:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: choco install nsis -y --no-progress
      - name: Package
        shell: bash
        working-directory: apps/desktop
        run: bun run package
      - name: Build without hideConsole
        shell: bash
        working-directory: apps/desktop
        run: |
          cat > /tmp/nohide.ts <<'TS'
          import { build } from "./node_modules/mantou-ui/runtime/build.ts";
          console.log(await build("src/main.tsx", "C:/nohide", "ShrinkDbg.exe"));
          TS
          cp /tmp/nohide.ts ./nohide.ts
          bun nohide.ts
      - name: Run installed (hidden console)
        if: always()
        shell: pwsh
        run: |
          $i = Get-ChildItem apps/desktop/dist/*.exe | Select -First 1
          Start-Process $i.FullName -ArgumentList '/S','/D=C:\shrink-app' -Wait
          Get-ChildItem C:\shrink-app
          $p = Start-Process C:\shrink-app\Shrink.exe -PassThru -RedirectStandardOutput C:\out-hidden.txt -RedirectStandardError C:\err-hidden.txt
          Start-Sleep 15
          "alive: $(-not $p.HasExited) exit: $($p.ExitCode)"
          Get-Content C:\out-hidden.txt, C:\err-hidden.txt
          Get-Process | Where-Object { $_.ProcessName -match 'Shrink|bun|conhost' } | Format-Table Id,ProcessName,MainWindowTitle
      - name: Release asset, child processes
        if: always()
        shell: pwsh
        run: |
          Get-Process Shrink -ErrorAction SilentlyContinue | Stop-Process -Force
          gh release download v0.1.0 -R dunkbing/shrink -p '*windows-x64.exe' -D rel --clobber
          (Get-FileHash rel\*.exe).Hash; (Get-FileHash apps\desktop\dist\*.exe).Hash
          Remove-Item -Recurse -Force $env:APPDATA\Shrink, $env:LOCALAPPDATA\Shrink -ErrorAction SilentlyContinue
          Start-Process (Get-ChildItem rel\*.exe).FullName -ArgumentList '/S','/D=C:\rel-app' -Wait
          $p = Start-Process C:\rel-app\Shrink.exe -PassThru -RedirectStandardOutput C:\o.txt -RedirectStandardError C:\e.txt
          foreach ($t in 1..12) {
            Start-Sleep 5
            $kids = Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id } | ForEach-Object { "$($_.Name) [$($_.CommandLine)]" }
            "t=$($t*5) alive=$(-not $p.HasExited) exit=$($p.ExitCode) children: $($kids -join '; ')"
          }
          Get-Content C:\o.txt, C:\e.txt
          Get-ChildItem -Recurse $env:LOCALAPPDATA\Shrink | Select FullName
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run from source
        if: always()
        shell: bash
        working-directory: apps/desktop
        run: |
          timeout 25 bun run start > /c-src.txt 2>&1; echo "exit $?"; cat /c-src.txt | head -80
