name: diag
on: workflow_dispatch
jobs:
  win:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: choco install nsis -y --no-progress
      - name: Package
        shell: bash
        working-directory: apps/desktop
        run: bun run package
      - name: Build without hideConsole
        shell: bash
        working-directory: apps/desktop
        run: |
          cat > /tmp/nohide.ts <<'TS'
          import { build } from "./node_modules/mantou-ui/runtime/build.ts";
          console.log(await build("src/main.tsx", "C:/nohide", "ShrinkDbg.exe"));
          TS
          cp /tmp/nohide.ts ./nohide.ts
          bun nohide.ts
      - name: Run installed (hidden console)
        if: always()
        shell: pwsh
        run: |
          $i = Get-ChildItem apps/desktop/dist/*.exe | Select -First 1
          Start-Process $i.FullName -ArgumentList '/S','/D=C:\shrink-app' -Wait
          Get-ChildItem C:\shrink-app
          $p = Start-Process C:\shrink-app\Shrink.exe -PassThru -RedirectStandardOutput C:\out-hidden.txt -RedirectStandardError C:\err-hidden.txt
          Start-Sleep 15
          "alive: $(-not $p.HasExited) exit: $($p.ExitCode)"
          Get-Content C:\out-hidden.txt, C:\err-hidden.txt
          Get-Process | Where-Object { $_.ProcessName -match 'Shrink|bun|conhost' } | Format-Table Id,ProcessName,MainWindowTitle
      - name: PE deps
        if: always()
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $env:PATH += ";" + (Split-Path (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select -First 1).FullName)
          dumpbin /dependents C:\shrink-app\mantou_ffi.dll
          dumpbin /dependents C:\shrink-app\Shrink.exe
          dumpbin /headers C:\shrink-app\Shrink.exe | Select-String 'subsystem'
          dumpbin /headers C:\nohide\ShrinkDbg.exe | Select-String 'subsystem'
          Get-ChildItem C:\Windows\System32\vcruntime140*.dll, C:\Windows\System32\msvcp140*.dll | Select Name
      - name: Run from source
        if: always()
        shell: bash
        working-directory: apps/desktop
        run: |
          timeout 25 bun run start > /c-src.txt 2>&1; echo "exit $?"; cat /c-src.txt | head -80
